name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure production API URL
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "PRODUCTION_API_URL repository variable is missing"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path("js/config.js")
          config = config_path.read_text()
          marker = 'const PRODUCTION_API_URL = "";'
          replacement = f"const PRODUCTION_API_URL = {json.dumps(os.environ['API_URL'])};"

          if config.count(marker) != 1:
              raise SystemExit(
                  f"Expected exactly one empty production API URL in {config_path}"
              )

          config_path.write_text(config.replace(marker, replacement, 1))
          PY

            sed -i "s|js/config.js|js/config.js?v=${GITHUB_SHA}|; s|js/app.js|js/app.js?v=${GITHUB_SHA}|" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
